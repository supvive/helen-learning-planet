services:
  - type: web
    name: hanzi-memory-app
    runtime: python
    plan: free
    buildCommand: python -m py_compile server.py
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_LUNA_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_VISION_TERRA_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_VISION_TIMEOUT_MS
        value: 120000
      - key: ALLOWED_ORIGINS
        value: https://supvive.github.io
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: APP_ACCESS_CODE
        sync: false
