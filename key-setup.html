<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek 授权 Local Key Setup</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="setup-page">
      <section class="surface setup-panel">
        <p class="eyebrow">Key Setup</p>
        <h1>出题授权</h1>
        <p class="lede">正式部署优先使用平台环境变量，本页仅作备用</p>
        <label for="setupApiKey">DeepSeek API Key</label>
        <input id="setupApiKey" type="password" autocomplete="off" placeholder="sk-..." />
        <div class="actions">
          <button id="saveKeyBtn" class="button primary" type="button">保存授权<br><span>Save Key</span></button>
          <a class="button secondary" href="./">返回练习<br><span>Back</span></a>
        </div>
        <p id="setupStatus" class="status">授权不会展示在主页面</p>
      </section>
    </main>
    <script>
      const statusEl = document.querySelector("#setupStatus");
      const ACCESS_STORAGE_KEY = "hanzi_app_access_code";
      function accessHeaders(headers = {}) {
        const code = localStorage.getItem(ACCESS_STORAGE_KEY) || "";
        return code ? { ...headers, "X-App-Access-Code": code } : headers;
      }
      async function saveWithAccess(apiKey) {
        let response = await fetch("/api/save-key", {
          method: "POST",
          headers: accessHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ apiKey })
        });
        if (response.status === 401) {
          const code = String(window.prompt("请输入学习网站访问码 / Access code") || "").trim();
          if (code) localStorage.setItem(ACCESS_STORAGE_KEY, code);
          response = await fetch("/api/save-key", {
            method: "POST",
            headers: accessHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({ apiKey })
          });
        }
        return response;
      }
      document.querySelector("#saveKeyBtn").addEventListener("click", async () => {
        const apiKey = document.querySelector("#setupApiKey").value.trim();
        if (!apiKey) {
          statusEl.textContent = "请先粘贴 API Key / Paste API Key first";
          return;
        }
        statusEl.textContent = "正在保存 / Saving";
        try {
          const response = await saveWithAccess(apiKey);
          const data = await response.json();
          statusEl.textContent = data.ok
            ? "已保存，可以返回每日练习 / Saved, back to practice"
            : `保存失败：${data.error || "Unknown error"}`;
          if (data.ok) document.querySelector("#setupApiKey").value = "";
        } catch {
          statusEl.textContent = "保存失败，请确认本地服务已启动 / Local service unavailable";
        }
      });
    </script>
  </body>
</html>
